<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Michaelens Studio | En construction</title>
  <link rel="icon" type="image/png" href="image/fav.png" />
<link rel="apple-touch-icon" href="image/fav.png" />

  <style>
    :root {
      --bg: #050607;
      --text: #f7f3ec;
      --muted: rgba(247, 243, 236, .64);
      --line: rgba(247, 243, 236, .16);
      --vh: 1vh;
      --carousel-opacity: 0;
      --carousel-progress: 0;
      --carousel-x: 0px;
      --carousel-start: clamp(560px, 43vw, 780px);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
      scroll-behavior: auto;
    }

    body {
      min-height: 360vh;
      min-height: calc(var(--vh) * 360);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      overflow-x: hidden;
    }

    .fixed-site {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      height: calc(var(--vh) * 100);
      overflow: hidden;
      background: #050607;
      isolation: isolate;
    }

    .video-stage {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      background: #050607;
      transform: translate3d(0, 0, 0);
      opacity: 1;
      will-change: transform, opacity;
      transition:
        transform 1250ms cubic-bezier(.16, 1, .3, 1),
        opacity 950ms cubic-bezier(.16, 1, .3, 1);
    }

    .video-stage.is-out {
      transform: translate3d(0, 112vh, 0);
      opacity: 0;
    }

    .hero-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .site-header {
      position: absolute;
      z-index: 40;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: clamp(18px, 3vw, 34px) clamp(22px, 4.8vw, 76px);
      pointer-events: none;
    }

    .logo-wrap {
      display: inline-flex;
      pointer-events: auto;
    }

    .logo-wrap img {
      height: clamp(58px, 7vw, 112px);
      width: auto;
      display: block;
      filter: drop-shadow(0 14px 30px rgba(0,0,0,.46));
    }

    .header-tag {
      position: absolute;
      top: clamp(76px, 8.8vw, 120px);
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      letter-spacing: .46em;
      text-transform: uppercase;
      color: rgba(247,243,236,.52);
      white-space: nowrap;
    }

    .scroll-label {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-size: 10px;
      letter-spacing: .34em;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .scroll-label::after {
      content: "";
      width: 1px;
      height: 54px;
      background: var(--line);
      display: block;
      animation: scrollPulse 1.9s ease-in-out infinite;
    }

    @keyframes scrollPulse {
      0%, 100% { opacity: .22; transform: scaleY(.65); }
      50% { opacity: 1; transform: scaleY(1); }
    }

    .content-layer {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    .content-layer::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: clamp(410px, 31vw, 620px);
      z-index: 3;
      background:
        linear-gradient(90deg, rgba(0,0,0,.54) 0%, rgba(0,0,0,.34) 54%, rgba(0,0,0,.12) 82%, rgba(0,0,0,0) 100%),
        linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.010));
      backdrop-filter: blur(18px) saturate(1.08);
      -webkit-backdrop-filter: blur(18px) saturate(1.08);
      pointer-events: none;
    }

    .text-zone {
      position: absolute;
      z-index: 5;
      left: clamp(26px, 5vw, 78px);
      top: 50%;
      width: min(420px, calc(100vw - 52px));
      transform: translateY(-50%);
      pointer-events: auto;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      font-size: clamp(10px, .85vw, 12px);
      letter-spacing: .34em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .eyebrow::before {
      content: "";
      width: 42px;
      height: 1px;
      background: var(--line);
    }

    h1 {
      font-size: clamp(30px, 3.4vw, 58px);
      line-height: .96;
      letter-spacing: -.04em;
      font-weight: 700;
      text-transform: uppercase;
      max-width: 410px;
      text-wrap: balance;
    }

    .thin {
      font-weight: 260;
      letter-spacing: -.035em;
    }

    .lead {
      margin-top: 23px;
      max-width: 398px;
      font-size: clamp(14px, 1.08vw, 17px);
      line-height: 1.58;
      color: rgba(247, 243, 236, .76);
    }

    .contact-card {
      margin-top: 30px;
      width: min(390px, 100%);
      padding: 16px 18px;
      border: 0;
      border-radius: 22px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.14), rgba(255,255,255,.040) 48%, rgba(255,255,255,.070)),
        rgba(5, 6, 7, .24);
      backdrop-filter: blur(28px) saturate(1.22);
      -webkit-backdrop-filter: blur(28px) saturate(1.22);
      display: grid;
      grid-template-columns: 46px 1fr;
      gap: 15px;
      align-items: center;
      box-shadow:
        0 28px 90px rgba(0,0,0,.34),
        inset 0 1px 0 rgba(255,255,255,.13),
        inset 0 -1px 0 rgba(255,255,255,.04);
      overflow: hidden;
      position: relative;
    }

    .contact-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 12% 0%, rgba(255,255,255,.18), transparent 34%), linear-gradient(115deg, rgba(255,255,255,.10), transparent 44%);
      opacity: .58;
      pointer-events: none;
    }

    .contact-card > * {
      position: relative;
      z-index: 1;
    }

    .mail-icon {
      width: 46px;
      height: 46px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.070);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
    }

    .mail-icon svg {
      width: 22px;
      height: 22px;
      stroke: var(--text);
      stroke-width: 1.45;
      fill: none;
    }

    .contact-small {
      font-size: 8px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .contact-link {
      color: var(--text);
      font-size: clamp(12px, 1.05vw, 16px);
      line-height: 1.1;
      text-decoration: none;
      word-break: break-word;
    }

    .gallery-zone {
      position: absolute;
      z-index: 1;
      inset: 8vh 0 7vh 0;
      opacity: var(--carousel-opacity);
      transform: translate3d(0, calc((1 - var(--carousel-progress)) * 54px), 0);
      pointer-events: auto;
      will-change: transform, opacity;
    }

    .carousel-shell {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    .carousel-track {
      height: 100%;
      display: flex;
      align-items: center;
      gap: clamp(22px, 2.4vw, 40px);
      transform: translate3d(calc(var(--carousel-x) * -1), 0, 0);
      transition: transform 120ms linear;
      will-change: transform;
      padding-left: var(--carousel-start);
      padding-right: clamp(34px, 5vw, 90px);
    }

    .photo-card {
      position: relative;
      flex: 0 0 clamp(360px, 30vw, 560px);
      width: clamp(360px, 30vw, 560px);
      aspect-ratio: 16 / 9;
      border-radius: 24px;
      overflow: hidden;
      background: rgba(255,255,255,.04);
      box-shadow: 0 30px 82px rgba(0,0,0,.26);
      transform: translate3d(0, calc(var(--card-offset) * 18px), 0);
      opacity: 1;
      will-change: transform;
      cursor: zoom-in;
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      image-rendering: auto;
    }

    .gallery-caption {
      position: absolute;
      right: clamp(18px, 3vw, 42px);
      bottom: clamp(8px, 2vh, 22px);
      z-index: 4;
      font-size: 10px;
      letter-spacing: .34em;
      text-transform: uppercase;
      color: rgba(247,243,236,.50);
      pointer-events: none;
    }

    .side-index {
      position: absolute;
      right: clamp(20px, 4vw, 64px);
      bottom: clamp(24px, 5vw, 62px);
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .22em;
      text-transform: uppercase;
      pointer-events: none;
    }

    .progress-track {
      width: 92px;
      height: 1px;
      background: var(--line);
      position: relative;
      overflow: hidden;
    }

    .progress-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 0%;
      background: var(--text);
      transition: width 120ms linear;
    }

    .panel-label {
      position: absolute;
      left: clamp(18px, 4vw, 62px);
      bottom: clamp(22px, 4vw, 58px);
      z-index: 40;
      color: rgba(247,243,236,.38);
      font-size: 10px;
      letter-spacing: .28em;
      text-transform: uppercase;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      pointer-events: none;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: grid;
      place-items: center;
      padding: 32px;
      background: rgba(0, 0, 0, .78);
      opacity: 0;
      pointer-events: none;
      transition: opacity 260ms ease;
    }

    .lightbox.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox img {
      display: block;
      width: auto;
      height: auto;
      max-width: min(92vw, var(--natural-width, 92vw));
      max-height: min(88vh, var(--natural-height, 88vh));
      object-fit: contain;
      box-shadow: 0 30px 100px rgba(0,0,0,.48);
    }

    .lightbox-close {
      position: absolute;
      top: 22px;
      right: 24px;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 999px;
      background: rgba(255,255,255,.10);
      color: var(--text);
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    @media (max-width: 1180px) {
      :root {
        --carousel-start: clamp(430px, 46vw, 620px);
      }

      .content-layer::before {
        width: clamp(400px, 38vw, 540px);
      }

      .photo-card {
        flex-basis: clamp(310px, 36vw, 430px);
        width: clamp(310px, 36vw, 430px);
      }
    }

    @media (max-width: 820px) {
      :root {
        --carousel-start: 20px;
      }

      body {
        min-height: 380vh;
        min-height: calc(var(--vh) * 380);
      }

      .video-stage.is-out {
        transform: translate3d(0, 116vh, 0);
      }

      .site-header {
        padding: 18px 20px;
      }

      .logo-wrap img {
        height: clamp(50px, 18vw, 82px);
      }

      .header-tag,
      .scroll-label,
      .panel-label,
      .gallery-caption {
        display: none;
      }

      .content-layer::before {
        top: auto;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 70vh;
        background:
          linear-gradient(180deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.46) 36%, rgba(0,0,0,.70) 100%),
          linear-gradient(180deg, rgba(255,255,255,.040), rgba(255,255,255,.010));
      }

      .text-zone {
        left: 20px;
        right: 20px;
        bottom: 74px;
        top: auto;
        width: min(350px, calc(100vw - 40px));
        transform: none;
      }

      .eyebrow {
        font-size: 9px;
        margin-bottom: 16px;
      }

      h1 {
        font-size: clamp(30px, 9.8vw, 46px);
        line-height: .98;
        letter-spacing: -.035em;
        max-width: 340px;
      }

      .lead {
        margin-top: 18px;
        font-size: 14px;
        max-width: 340px;
      }

      .contact-card {
        width: min(330px, 100%);
        margin-top: 24px;
        padding: 15px;
        grid-template-columns: 44px 1fr;
        gap: 13px;
        border-radius: 20px;
      }

      .mail-icon {
        width: 44px;
        height: 44px;
        border-radius: 14px;
      }

      .contact-link {
        font-size: clamp(12px, 4.1vw, 15px);
      }

      .gallery-zone {
        inset: 88px 0 265px 0;
        transform: translate3d(0, calc((1 - var(--carousel-progress)) * 44px), 0);
      }

      .carousel-track {
        gap: 14px;
        padding-right: 20px;
      }

      .photo-card {
        flex: 0 0 clamp(260px, 84vw, 430px);
        width: clamp(260px, 84vw, 430px);
        aspect-ratio: 16 / 9;
        border-radius: 20px;
      }

      .side-index {
        right: 20px;
        bottom: 20px;
        font-size: 10px;
        gap: 9px;
      }

      .progress-track {
        width: 52px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <div class="fixed-site">
    <div class="video-stage" id="videoStage">
      <video class="hero-video" src="image/video.mp4" muted playsinline autoplay loop preload="auto"></video>
    </div>

    <header class="site-header">
      <a class="logo-wrap" href="#" aria-label="Michaelens Studio">
        <img src="image/logo.png" alt="Michaelens Studio" />
      </a>
      <div class="header-tag">Photography Studio</div>
      <div class="scroll-label">Scroll</div>
    </header>

    <main class="content-layer">
      <section class="text-zone" aria-label="Michaelens Studio en construction">
        <div class="eyebrow">Michaelens Studio</div>
        <h1>Site en<br><span class="thin">construction</span></h1>
        <p class="lead">Le site est actuellement en cours de construction. Le studio prépare une nouvelle présence en ligne dédiée à la photographie professionnelle.</p>

        <div class="contact-card">
          <div class="mail-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48">
              <rect x="8" y="12" width="32" height="24" rx="2"></rect>
              <path d="M9 14l15 13 15-13"></path>
              <path d="M18 24L9 35"></path>
              <path d="M30 24l9 11"></path>
            </svg>
          </div>
          <div>
            <div class="contact-small">Pour me contacter</div>
            <a class="contact-link" href="mailto:contact@michaelens-studio.ch">contact@michaelens-studio.ch</a>
          </div>
        </div>
      </section>

      <section class="gallery-zone" aria-label="Galerie Michaelens Studio">
        <div class="carousel-shell">
          <div class="carousel-track" id="carouselTrack">
            <figure class="photo-card"><img src="image/bg.png" alt="Photo Michaelens Studio 1"></figure>
            <figure class="photo-card"><img src="image/bg2.png" alt="Photo Michaelens Studio 2"></figure>
            <figure class="photo-card"><img src="image/bg3.png" alt="Photo Michaelens Studio 3"></figure>
            <figure class="photo-card"><img src="image/bg4.png" alt="Photo Michaelens Studio 4"></figure>
            <figure class="photo-card"><img src="image/bg5.png" alt="Photo Michaelens Studio 5"></figure>
            <figure class="photo-card"><img src="image/bg6.png" alt="Photo Michaelens Studio 6"></figure>
            <figure class="photo-card"><img src="image/bg7.png" alt="Photo Michaelens Studio 7"></figure>
            <figure class="photo-card"><img src="image/bg8.png" alt="Photo Michaelens Studio 8"></figure>
          </div>
        </div>
     
      </section>
    </main>

    <div class="panel-label">01 / Accueil</div>

    <div class="side-index" aria-hidden="true">
      <span id="currentIndex">01</span>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span>08</span>
    </div>

    <div class="lightbox" id="lightbox" aria-hidden="true">
      <button class="lightbox-close" type="button" aria-label="Fermer">×</button>
      <img id="lightboxImage" src="" alt="">
    </div>
  </div>

  <script>
    const root = document.documentElement;
    const videoStage = document.getElementById('videoStage');
    const progressFill = document.getElementById('progressFill');
    const currentIndex = document.getElementById('currentIndex');
    const cards = Array.from(document.querySelectorAll('.photo-card'));
    const totalCards = cards.length;
    const carouselShell = document.querySelector('.carousel-shell');
    const carouselTrack = document.querySelector('.carousel-track');
    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightboxImage');
    const lightboxClose = document.querySelector('.lightbox-close');

    function setVh() {
      root.style.setProperty('--vh', `${window.innerHeight * 0.01}px`);
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function smoothStep(edge0, edge1, value) {
      const t = clamp((value - edge0) / (edge1 - edge0), 0, 1);
      return t * t * (3 - 2 * t);
    }

    function pad(number) {
      return String(number).padStart(2, '0');
    }

    function getCarouselStartPx() {
      const styles = getComputedStyle(carouselTrack);
      return parseFloat(styles.paddingLeft) || 0;
    }

    function updateCarousel(progress) {
      const startOffset = getCarouselStartPx();
      const maxCarouselX = Math.max(0, carouselTrack.scrollWidth - carouselShell.clientWidth);
     const travel = maxCarouselX;
      root.style.setProperty('--carousel-x', `${(travel * progress).toFixed(2)}px`);
    }

    function render() {
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      const rawProgress = maxScroll > 0 ? window.scrollY / maxScroll : 0;
      const progress = clamp(rawProgress, 0, 1);

      const videoShouldBeOut = progress >= .18;
      const carouselOpacity = smoothStep(.38, .50, progress);
      const carouselProgress = smoothStep(.48, 1, progress);
      const activePhoto = Math.round(carouselProgress * (totalCards - 1)) + 1;

      videoStage.classList.toggle('is-out', videoShouldBeOut);
      root.style.setProperty('--carousel-opacity', carouselOpacity.toFixed(4));
      root.style.setProperty('--carousel-progress', carouselProgress.toFixed(4));
      updateCarousel(carouselProgress);

      progressFill.style.width = `${Math.max(8, carouselProgress * 100)}%`;
      currentIndex.textContent = pad(activePhoto);

      cards.forEach((card, index) => {
        const y = Math.sin((index + carouselProgress * 3.4) * 1.55) * 18;
        card.style.setProperty('--card-offset', (y / 18).toFixed(3));
      });
    }

    let ticking = false;

    function requestRender() {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        render();
        ticking = false;
      });
    }

    cards.forEach(card => {
      const img = card.querySelector('img');
      card.addEventListener('click', () => {
        lightboxImage.src = img.currentSrc || img.src;
        lightboxImage.alt = img.alt || '';
        lightboxImage.onload = () => {
          lightboxImage.style.setProperty('--natural-width', `${lightboxImage.naturalWidth}px`);
          lightboxImage.style.setProperty('--natural-height', `${lightboxImage.naturalHeight}px`);
        };
        lightbox.classList.add('is-open');
        lightbox.setAttribute('aria-hidden', 'false');
      });
    });

    function closeLightbox() {
      lightbox.classList.remove('is-open');
      lightbox.setAttribute('aria-hidden', 'true');
      lightboxImage.src = '';
    }

    lightboxClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', event => {
      if (event.target === lightbox) closeLightbox();
    });
    window.addEventListener('keydown', event => {
      if (event.key === 'Escape' && lightbox.classList.contains('is-open')) closeLightbox();
    });

    setVh();
    render();

    window.addEventListener('scroll', requestRender, { passive: true });
    window.addEventListener('resize', () => {
      setVh();
      requestRender();
    });
    window.addEventListener('orientationchange', () => {
      setTimeout(() => {
        setVh();
        requestRender();
      }, 250);
    });
  </script>
</body>
</html>
